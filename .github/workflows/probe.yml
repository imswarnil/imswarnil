name: probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          SHA=$(git rev-parse HEAD)
          echo "--- create refs/heads/probe-scratch"
          gh api -X POST repos/${{ github.repository }}/git/refs \
            -f ref=refs/heads/probe-scratch -f sha=$SHA -i 2>&1 | head -1
          echo "--- update refs/heads/main (no-op, same sha)"
          gh api -X PATCH repos/${{ github.repository }}/git/refs/heads/main \
            -f sha=$SHA -i 2>&1 | head -1
          echo "--- delete scratch"
          gh api -X DELETE repos/${{ github.repository }}/git/refs/heads/probe-scratch -i 2>&1 | head -1
          exit 0
