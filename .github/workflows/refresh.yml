name: Refresh cards

# Redraws the banner and the stats card. The stats come from the GitHub API and go
# stale on their own, so this runs every morning as well as on push.
on:
  schedule:
    - cron: '17 4 * * *'
  push:
    branches: [main]
    paths: ['scripts/**', 'fonts/**', '.github/workflows/refresh.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r scripts/requirements.txt

      - name: Render
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/render.py --stats
          python3 scripts/readme.py

      - name: Commit if anything moved
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/publish.py
